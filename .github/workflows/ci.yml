name: CI & Quality Validation

# Defines when this GitHub Action workflow runs:
# 1. On direct push to main, feature/*, fix/*, or bob/* branches
# 2. On pull requests targeting the main branch
# 3. Manually via the GitHub Actions UI ("workflow_dispatch")
on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'bob/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Validate, Test, and Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository code into the GitHub Actions runner
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      # Step 2: Install Node.js runtime for the frontend application
      - name: 2. Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demos/new-demo/frontend/package-lock.json

      # Step 3: Install Python runtime for the backend FastAPI application
      - name: 3. Setup Python (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: demos/new-demo/backend/requirements.txt

      # Step 4: Run repository compliance, secrets scan, and data safety checks
      - name: 4. Run Compliance & Safety Checks
        run: |
          chmod +x ./demos/new-demo/scripts/*.sh
          ./demos/new-demo/scripts/check-compliance.sh

      # Step 5: Install frontend dependencies and verify Vite/React build succeeds
      - name: 5. Install & Build Frontend
        working-directory: demos/new-demo/frontend
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      # Step 6: Boot mock backend & frontend to verify all API endpoints and UI
      - name: 6. Run Smoke Verification (Backend & Frontend)
        run: |
          ./demos/new-demo/scripts/verify-demo.sh

  bob-pr-guidance:
    name: Bob Pull Request Workflow Guidance
    # This job only runs when a Pull Request is opened or updated (skipped on direct push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Explain Bob collaboration workflow
        run: |
          echo "=========================================================="
          echo "=== IBM Bob GitHub SDLC Collaboration Workflow Guide ==="
          echo "=========================================================="
          echo "1. PR Opened: GitHub Actions triggers CI checks automatically."
          echo "2. Analysis: Bob analyzes the PR diff, description, and issue context."
          echo "3. Enhancement: Bob implements changes locally with clean code practices."
          echo "4. Validation: Bob runs verify-demo and compliance checks before pushing."
          echo "5. Merge Readiness: Once all checks pass, the PR is approved and merged."
